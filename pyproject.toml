[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aspire-brain"
version = "0.1.0"
description = "Fictional local permission-aware knowledge assistant"
requires-python = ">=3.12"
dependencies = ["fastapi", "pydantic>=2", "uvicorn", "jinja2", "itsdangerous", "python-dotenv", "cryptography>=42,<48"]

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "httpx", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aspire_brain = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["redteam: optional offline evaluation tests, explicitly selected from tests/redteam"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
source = ["aspire_brain"]

[tool.coverage.report]
show_missing = true
fail_under = 80
